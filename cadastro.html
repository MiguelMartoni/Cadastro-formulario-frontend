<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&family=Boldonse&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <ul>
        <a href="index.html"><li>Cadastro</li></a>
        <a href="lista.html"><li>Exibir Dados</li></a>
      </ul>
    </header>

    <main>
      <form id="cadastroForm">
        <h1>Cadastrar</h1>

        <div class="box-form">
          <label for="inpNome">Nome</label>
          <input type="text" id="inpNome" name="inpNome" placeholder="Nome" />

          <label for="inpEmail">E-mail</label>
          <input
            type="text"
            id="inpEmail"
            name="inpEmail"
            placeholder="email@email.com"
          />

          <label for="inpIdade">Idade</label>
          <input
            type="number"
            id="inpIdade"
            name="inpIdade"
            placeholder="Idade"
          />

          <div class="btn-form">
            <button class="btn btn-send" type="button" onclick="cadastrar()">
              Cadastrar
            </button>
            <button class="btn btn-clear" type="reset">Limpar</button>
          </div>
        </div>
      </form>
    </main>
    <script src="cadastro.js"></script>
  </body>
</html>
